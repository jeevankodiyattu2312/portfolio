<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e0d">
<meta name="description" content="Jeevan K John — Electronics and Communication Engineering student interested in control, instrumentation, electronics, and practical ideas for industry.">
<title>Jeevan K John — ECE Portfolio</title>

<style>
:root {
  --bg: #0b0e0d;
  --surface: #121715;
  --surface2: #171d19;
  --text: #f3f5ef;
  --muted: #a5b0a7;
  --line: #2a342d;
  --accent: #c8f169;
  --accent-dark: #18220b;
  --blue: #a9c9ff;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 Inter, ui-sans-serif, system-ui,
        -apple-system, "Segoe UI", sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, textarea {
  font: inherit;
}

.wrap {
  width: min(1120px, calc(100% - 44px));
  margin-inline: auto;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  background: #0b0e0deF;
  backdrop-filter: blur(16px);
  border-bottom: 1px solid #ffffff10;
}

nav {
  min-height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.brand {
  font-size: 1.04rem;
  font-weight: 850;
  letter-spacing: -.04em;
}

.brand b {
  color: var(--accent);
}

.navlinks {
  display: flex;
  gap: 26px;
  color: var(--muted);
  font-size: .91rem;
}

.navlinks a:hover {
  color: var(--accent);
}

/* HERO */

.hero {
  min-height: 690px;
  padding: 88px 0 92px;
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  align-items: center;
  gap: 72px;
}

.kicker {
  font-size: .76rem;
  text-transform: uppercase;
  letter-spacing: .19em;
  font-weight: 800;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 10px;
}

.kicker:before {
  content: "";
  width: 26px;
  height: 1px;
  background: var(--accent);
}

h1 {
  font-size: clamp(3.4rem, 7vw, 6.3rem);
  line-height: .98;
  letter-spacing: -.08em;
  margin: 22px 0 25px;
}

h1 span {
  color: var(--accent);
}

.hero p {
  max-width: 610px;
  color: var(--muted);
  font-size: 1.12rem;
}

.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 30px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 12px 19px;
  font-weight: 750;
  transition: transform .2s, background .2s;
  cursor: pointer;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn.primary {
  background: var(--accent);
  color: #11170a;
  border-color: var(--accent);
}

.btn.ghost:hover {
  border-color: var(--accent);
}

/* PROFILE PHOTO */

.portrait-frame {
  position: relative;
  max-width: 430px;
  justify-self: end;
  width: 100%;
  padding: 13px;
  border: 1px solid #3a473c;
  border-radius: 28px;
  background: linear-gradient(145deg, #202a22, #101512);
  transform: rotate(1deg);
}

.portrait-frame:after {
  content: "ECE / CONTROL / BUILD";
  position: absolute;
  bottom: 27px;
  left: -28px;
  background: var(--accent);
  color: #15200a;
  font-size: .68rem;
  font-weight: 900;
  letter-spacing: .13em;
  padding: 9px 13px;
  border-radius: 6px;
  transform: rotate(-4deg);
}

.portrait {
  width: 100%;
  height: 510px;
  display: block;
  object-fit: cover;
  object-position: center 24%;
  border-radius: 19px;
  filter: saturate(.82);
}

/* GENERAL SECTIONS */

section {
  padding: 91px 0;
  border-top: 1px solid var(--line);
}

.section-top {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 30px;
  margin-bottom: 39px;
}

.section-no {
  color: var(--accent);
  font-size: .76rem;
  font-weight: 850;
  letter-spacing: .15em;
}

.section-title {
  font-size: clamp(2.3rem, 5vw, 3.8rem);
  line-height: 1.04;
  letter-spacing: -.07em;
  margin: 9px 0 0;
}

.section-intro {
  max-width: 450px;
  color: var(--muted);
  margin: 0;
}

/* ABOUT ME */

.about-grid {
  display: grid;
  grid-template-columns: .85fr 1.15fr;
  gap: 70px;
}

.about-copy {
  font-size: 1.08rem;
  color: #d9ded8;
}

.about-copy p {
  margin-top: 0;
}

.about-copy strong {
  color: var(--text);
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 27px;
}

.info-card {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 17px;
  border-radius: 13px;
}

.info-card small {
  display: block;
  text-transform: uppercase;
  letter-spacing: .12em;
  font-size: .68rem;
  color: var(--accent);
  font-weight: 850;
  margin-bottom: 5px;
}

.info-card span {
  font-weight: 700;
}

/* SKILLS */

.skills-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.skill-card {
  padding: 25px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: var(--surface);
  min-height: 220px;
}

.skill-icon {
  width: 43px;
  height: 43
